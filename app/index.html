<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>부품 인식 AI 테스트 시스템</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            max-width: 600px;
            margin: 40px auto;
            padding: 20px;
            background-color: #f9f9f9;
            color: #333;
        }
        h2 { text-align: center; color: #4A5568; }
        
        /* 드래그 앤 드롭 및 이미지 표시 구역 */
        .upload-zone {
            border: 3px dashed #CBD5E0;
            border-radius: 12px;
            background-color: #fff;
            min-height: 300px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
            margin-bottom: 20px;
        }
        .upload-zone.dragover {
            border-color: #4299E1;
            background-color: #EBF8FF;
        }
        .upload-zone p { color: #718096; text-align: center; padding: 20px; }
        
        /* 프리뷰 및 결과 이미지 스타일 */
        .upload-zone img {
            max-width: 100%;
            max-height: 300px;
            object-fit: contain;
            display: none;
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: #4299E1;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover { background-color: #3182CE; }
        
        /* 결과창 스타일 */
        .result-box {
            margin-top: 20px;
            padding: 15px;
            background-color: #edf2f7;
            border-radius: 8px;
            display: none;
        }
    </style>
</head>
<body>

    <h2>프린터 부품 식별 시스템</h2>

    <div class="upload-zone" id="dropZone" onclick="document.getElementById('fileInput').click()">
        <p id="dropText">📸 Drag & Drop your Image or <br>Click the button to upload your Image.</p>
        <img id="imagePreview" alt="부품 이미지 영역">
        <input type="file" id="fileInput" accept="image/*" style="display: none;">
    </div>

    <button onclick="uploadAndAnalyze()">Start to detect</button>

    <div class="result-box" id="resultBox">
        <h3>Result</h3>
        <p><b>Part name:</b> <span id="partName">-</span></p>
        <p><b>Serial number:</b> <span id="serialNumber">-</span></p>
        <p><b>accuracy:</b> <span id="confidence">-</span></p>
        <p style="font-size: 13px; color: #666;"><span id="message"></span></p>
    </div>

    <script>
        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');
        const dropText = document.getElementById('dropText');
        const imagePreview = document.getElementById('imagePreview');
        const resultBox = document.getElementById('resultBox');
        
        let selectedFile = null;

        // --- 드래그 앤 드롭 이벤트 처리 ---
        ['dragenter', 'dragover'].forEach(eventName => {
            dropZone.addEventListener(eventName, (e) => {
                e.preventDefault();
                dropZone.classList.add('dragover');
            }, false);
        });

        ['dragleave', 'drop'].forEach(eventName => {
            dropZone.addEventListener(eventName, (e) => {
                e.preventDefault();
                dropZone.classList.remove('dragover');
            }, false);
        });

        dropZone.addEventListener('drop', (e) => {
            const dt = e.dataTransfer;
            const files = dt.files;
            if (files.length > 0) {
                handleFile(files[0]);
            }
        });

        fileInput.addEventListener('change', (e) => {
            if (fileInput.files.length > 0) {
                handleFile(fileInput.files[0]);
            }
        });

        // 파일 선택 시 칸 내부에 이미지를 띄우는 로직
        function handleFile(file) {
            selectedFile = file;
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onloadend = function() {
                imagePreview.src = reader.result;
                imagePreview.style.display = 'block';
                dropText.style.display = 'none'; // 💡 오타 수정 (style.style -> style)
            }
        }

        // --- 백엔드 통신 ---
        async function uploadAndAnalyze() {
            if (!selectedFile) {
                alert("먼저 이미지를 업로드해주세요!");
                return;
            }

            const formData = new FormData();
            formData.append("file", selectedFile);

            document.getElementById('partName').innerText = "분석 중...";
            resultBox.style.display = 'block';

            try {
                const response = await fetch('/predict', {
                    method: 'POST',
                    body: formData
                });
                const data = await response.json();

                // 텍스트 결과 매핑
                document.getElementById('partName').innerText = data.part_name;
                document.getElementById('serialNumber').innerText = data.serial_number;
                // 정확도를 보기 좋게 반올림하여 %로 출력 (예: 0.9452 -> 94.52%)
                document.getElementById('confidence').innerText = (data.confidence * 100).toFixed(2) + "%";
                document.getElementById('message').innerText = data.message;

                // 🎯 [💡 적용 완료] AI가 처리한 BBox 이미지를 받아와 프리뷰 화면에 바로 덮어씌웁니다.
                // 🎯 브라우저 캐시를 깨부수고 강제로 바운딩 박스 이미지로 교체합니다!
                if (data.image_base64) {
                    imagePreview.style.display = 'none'; // 잠시 숨겼다가
                    imagePreview.src = "data:image/jpeg;base64," + data.image_base64;
                    imagePreview.style.display = 'block'; // 새 이미지로 다시 띄우기
                }

            } catch (error) {
                alert("서버 통신 오류 발생");
                console.error(error);
            }
        }
    </script>
</body>
</html>
